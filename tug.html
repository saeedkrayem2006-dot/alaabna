<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>شد الحبل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: sweaty, shouty field-day contest between two sides of one phone.
IDEA: a school sports-day tug of war on grass — a rope with a red ribbon knot over a chalk line.
PICTURE: the rope runs top to bottom across the whole screen; the ribbon slides toward the stronger side.
COLOUR and TYPE: field green #3fa34d and chalk white, team red #ff5a4e vs team blue #3a7bff, rope tan; Lalezar shouts, Cairo text.
LAYOUT: top half (turned) for team red, bottom half for team blue, rope between; setup and results centred.
*/
:root{color-scheme:light;--grass:#3fa34d;--grass2:#358f41;--ink:#14240f;--a:#ff5a4e;--b:#3a7bff;--rope:#d7a86e;--paper:#fffbea}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:repeating-linear-gradient(0deg,var(--grass) 0 48px,var(--grass2) 48px 96px);color:var(--ink);font:16px/1.5 Cairo,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto}
.screen.on{display:flex}
#setup{padding-top:64px}
.home{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.85);color:var(--ink);font:700 15px Cairo;text-decoration:none}
.panel{width:min(420px,100%);background:var(--paper);border-radius:24px;padding:20px;display:grid;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
h1{font:400 clamp(44px,13vw,70px)/1.05 Lalezar,Cairo;margin:0;text-align:center}
.row{display:flex;align-items:center;gap:10px}
.dot{width:22px;height:22px;border-radius:50%;flex:none}
input{flex:1;font:700 16px Cairo;padding:10px 14px;border-radius:12px;border:2px solid #d9d2b8;background:#fff;color:var(--ink);min-height:46px}
input:focus{outline:none;border-color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:2px solid #d9d2b8;background:#fff;font:700 15px Cairo;color:var(--ink)}
.seg button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{min-height:60px;width:100%;border:0;border-radius:18px;background:#ffd23f;color:#3a2a00;font:400 30px Lalezar,Cairo;box-shadow:0 6px 0 #c49a00;cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c49a00}
.ghost{min-height:48px;width:100%;border-radius:16px;border:2px solid var(--ink);background:none;color:var(--ink);font:700 17px Cairo}
button:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:3px}
.note{margin:0;font-size:15px;text-align:center;opacity:.85}
/* play */
#play{padding:0}
.side{position:absolute;left:0;right:0;height:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;gap:4px}
.side.a{top:0;transform:rotate(180deg);background:linear-gradient(0deg,transparent,#ff5a4e55)}
.side.b{bottom:0;background:linear-gradient(180deg,transparent,#3a7bff55)}
.side .nm{font:900 20px Cairo;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.side .hint{font:400 clamp(36px,11vw,56px)/1 Lalezar,Cairo;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.side .wins{display:flex;gap:6px}.side .wins i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35)}.side .wins i.f{background:#ffd23f}
.side.tap{animation:tp .12s}
@keyframes tp{50%{filter:brightness(1.3)}}
.side.power{box-shadow:inset 0 0 0 8px #ffd23f}
svg.field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#count{position:absolute;inset:0;display:grid;place-items:center;font:400 120px Lalezar,Cairo;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none}
#star{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;display:none;z-index:4;touch-action:none;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#quit{position:fixed;top:50%;left:10px;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font:700 18px Cairo;z-index:6;display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<button id="quit" aria-label="رجوع">✕</button>

<section id="setup" class="screen on">
  <a class="home" href="index.html">→ ألعابنا</a>
  <div class="panel">
    <h1>شد الحبل</h1>
    <p class="note">لاعبين أو فريقين. حطّوا التلفون بالنص وكل فريق من جهة.</p>
    <div class="row"><span class="dot" style="background:var(--a)"></span><input id="na" maxlength="14" value="الفريق الأحمر" aria-label="اسم الفريق الأحمر"></div>
    <div class="row"><span class="dot" style="background:var(--b)"></span><input id="nb" maxlength="14" value="الفريق الأزرق" aria-label="اسم الفريق الأزرق"></div>
    <div class="seg" id="bo" role="group" aria-label="عدد الجولات"><button data-v="1">جولة وحدة</button><button data-v="2" class="sel">أفضل من ٣</button><button data-v="3">أفضل من ٥</button></div>
    <button class="big" id="start">شدّوا!</button>
    <p class="note">اكبسوا بسرعة على نصّكم عشان تسحبوا الشريطة الحمرا لعندكم. النجمة الذهبية بتعطي اللي بيمسكها قوة مضاعفة ٣ ثواني!</p>
  </div>
</section>

<section id="play" class="screen">
  <div class="side a" id="sa"><span class="nm" id="la"></span><span class="hint">اكبس!</span><span class="wins" id="wa"></span></div>
  <div class="side b" id="sb"><span class="nm" id="lb"></span><span class="hint">اكبس!</span><span class="wins" id="wb"></span></div>
  <svg class="field" id="field" aria-hidden="true"></svg>
  <svg id="star" viewBox="0 0 100 100" aria-label="نجمة قوة"><path d="M50 4 L62 36 L96 38 L69 59 L79 93 L50 73 L21 93 L31 59 L4 38 L38 36 Z" fill="#ffd23f" stroke="#b88a00" stroke-width="4"/></svg>
  <div id="count"></div>
</section>

<section id="end" class="screen">
  <div class="panel">
    <h1 id="wt"></h1>
    <p class="note" id="ws"></p>
    <button class="big" id="again">جولة ثانية</button>
    <button class="ghost" id="back">رجوع</button>
  </div>
</section>

<script>
{
const $=s=>document.querySelector(s);
let names=['',''],need=2,wins=[0,0],pos=0,running=false,power=[0,0],starT=null,actx=null;
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));$('#quit').style.display=id==='play'?'block':'none'};
function beep(f,d,t,v){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t||'triangle';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d)}catch(e){}}

function drawField(){
  const s=$('#field'),W=s.clientWidth,H=s.clientHeight,cx=W/2,mid=H/2,goal=H*.32;
  const ky=mid+pos*goal;
  s.innerHTML=`
   <line x1="0" y1="${mid-goal}" x2="${W}" y2="${mid-goal}" stroke="#fff" stroke-width="5" stroke-dasharray="14 10" opacity=".9"/>
   <line x1="0" y1="${mid+goal}" x2="${W}" y2="${mid+goal}" stroke="#fff" stroke-width="5" stroke-dasharray="14 10" opacity=".9"/>
   <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="#fff" stroke-width="2" opacity=".5"/>
   <line x1="${cx}" y1="-10" x2="${cx}" y2="${H+10}" stroke="#8a5a2b" stroke-width="16" stroke-linecap="round"/>
   <line x1="${cx}" y1="-10" x2="${cx}" y2="${H+10}" stroke="var(--rope)" stroke-width="11" stroke-dasharray="10 6"/>
   <g transform="translate(${cx} ${ky})">
     <path d="M0 0 L-34 -16 L-34 16 Z M0 0 L34 -16 L34 16 Z" fill="#e3262d" stroke="#8d1015" stroke-width="2"/>
     <circle r="12" fill="#e3262d" stroke="#8d1015" stroke-width="3"/>
   </g>`;
}
const ro=new ResizeObserver(drawField);ro.observe($('#field'));

function dots(i){return Array.from({length:need},(_,k)=>`<i class="${k<wins[i]?'f':''}"></i>`).join('')}
function paint(){$('#la').textContent=names[0];$('#lb').textContent=names[1];$('#wa').innerHTML=dots(0);$('#wb').innerHTML=dots(1);drawField()}

function pull(i){
  if(!running)return;
  const step=.022*(power[i]>Date.now()?2:1);
  pos+=i===0?-step:step;
  const s=i?$('#sb'):$('#sa');s.classList.remove('tap');void s.offsetWidth;s.classList.add('tap');
  beep(i?330:262,.04,'square',.03);
  if(pos<=-1||pos>=1)winRound(pos<0?0:1);
  drawField();
}
$('#sa').addEventListener('pointerdown',e=>{e.preventDefault();pull(0)});
$('#sb').addEventListener('pointerdown',e=>{e.preventDefault();pull(1)});

function spawnStar(){
  if(!running)return;
  const st=$('#star'),W=innerWidth,H=innerHeight,side=Math.random()<.5?0:1;
  st.style.left=(60+Math.random()*(W-120))+'px';
  st.style.top=(side?H*.6+Math.random()*H*.3:H*.1+Math.random()*H*.3)+'px';
  st.style.display='block';st.dataset.on='1';
  setTimeout(()=>{st.style.display='none';st.dataset.on=''},1400);
  starT=setTimeout(spawnStar,4000+Math.random()*4000);
}
$('#star').addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();if(!running||!e.currentTarget.dataset.on)return;
  const i=e.clientY<innerHeight/2?0:1;
  power[i]=Date.now()+3000;e.currentTarget.style.display='none';e.currentTarget.dataset.on='';
  const s=i?$('#sb'):$('#sa');s.classList.add('power');setTimeout(()=>s.classList.remove('power'),3000);
  beep(1320,.1);setTimeout(()=>beep(1760,.15),80);
});

function countdown(n){
  $('#count').textContent=n||'شدّوا!';beep(n?520:1040,.15,'square',.06);
  if(n>0)setTimeout(()=>countdown(n-1),700);
  else setTimeout(()=>{$('#count').textContent='';running=true;starT=setTimeout(spawnStar,3000)},400);
}
function round(){pos=0;power=[0,0];paint();show('play');setTimeout(()=>countdown(3),200)}
function winRound(i){
  running=false;clearTimeout(starT);$('#star').style.display='none';
  wins[i]++;paint();
  beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.3),300);
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
  const done=wins[i]>=need;
  setTimeout(()=>{
    if(done){
      $('#wt').textContent=names[i]+' ربح!';$('#wt').style.color=i?'var(--b)':'var(--a)';
      $('#ws').textContent=`النتيجة ${wins[0]} – ${wins[1]}`;$('#again').textContent='لعبة جديدة';
    }else{
      $('#wt').textContent=names[i]+' أخد الجولة';$('#wt').style.color=i?'var(--b)':'var(--a)';
      $('#ws').textContent=`${names[0]} ${wins[0]} – ${wins[1]} ${names[1]}`;$('#again').textContent='الجولة الجاية';
    }
    $('#again').dataset.done=done?'1':'';
    show('end');
  },900);
}
function start(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){actx=null}
  names=[$('#na').value.trim()||'الأحمر',$('#nb').value.trim()||'الأزرق'];wins=[0,0];round();
}
$('#bo').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;need=+b.dataset.v;$('#bo').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))});
$('#start').addEventListener('click',start);
$('#again').addEventListener('click',e=>{e.currentTarget.dataset.done?start():round()});
$('#back').addEventListener('click',()=>show('setup'));
$('#quit').addEventListener('click',()=>{running=false;clearTimeout(starT);show('setup')});
}
</script>
</body>
</html>
