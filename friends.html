<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>أصحابي — ألعابنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="social.css">
<style>
/*
VOICE: warm and chatty — your gang, who is online, quick chats.
IDEA: a messenger contact list with little character heads, then a chat thread with invite cards.
PICTURE: the friends list of characters with green online dots; in chat, bubbles and game-invite cards.
COLOUR and TYPE: cream page, white cards, sun yellow accents, green online; Lalezar headings, Cairo text.
LAYOUT: add-friend card, requests, friends list; chat view replaces the list with a sticky composer.
*/
.card{width:100%;background:var(--card);border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 4px 0 #00000010}
.card h3{margin:0;font:400 22px Lalezar,Cairo}
.add{display:flex;gap:8px}
.add input{flex:1;text-transform:uppercase;letter-spacing:.12em;direction:ltr;text-align:center;font-weight:900}
.row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:16px}
.row+.row{border-top:1px solid light-dark(#f0e8f6,#3a2852)}
.row .n{flex:1;font-weight:900;line-height:1.3}
.row .n small{display:block;font-weight:400;color:var(--mute)}
.row .acts{display:flex;gap:6px}
.row .acts button{min-height:40px;border:0;border-radius:12px;padding:0 12px;font:900 14px Cairo;background:var(--sun);color:#2b1340;cursor:pointer;position:relative}
.row .acts .no{background:light-dark(#eee,#3a2852);color:var(--ink)}
.av{position:relative;flex:none}
.dot{position:absolute;bottom:4px;left:2px;width:13px;height:13px;border-radius:50%;background:#bbb;border:2px solid var(--card)}
.dot.on{background:var(--ok)}
.msg{min-height:20px;margin:0;font-weight:700;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:10px;margin:0}
.mycode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.mycode b{font:400 22px Lalezar,Cairo;letter-spacing:.12em;color:var(--ink);direction:ltr}
/* chat */
#chat{width:100%;display:flex;flex-direction:column;gap:10px}
.chead{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px 12px}
.chead .n{flex:1;font-weight:900}
.chead .n small{display:block;font-weight:400;color:var(--mute)}
.log{display:flex;flex-direction:column;gap:6px;min-height:50vh;padding:4px 2px 90px}
.b{max-width:80%;align-self:flex-start;background:var(--card);border-radius:18px 18px 18px 6px;padding:7px 12px;overflow-wrap:anywhere;box-shadow:0 2px 0 #00000010}
.b.me{align-self:flex-end;background:var(--sun);color:#2b1340;border-radius:18px 18px 6px 18px}
.b time{display:block;font-size:11px;opacity:.6}
.inv{align-self:stretch;max-width:none;border:2px dashed #9b5de5;display:flex;align-items:center;gap:10px}
.inv .t{flex:1;font-weight:900}
.inv a{background:var(--ok);color:#fff;border-radius:12px;padding:8px 14px;text-decoration:none;font-weight:900}
.composer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;max-width:560px;margin:0 auto;box-shadow:0 -6px 18px #0000001a}
.composer input{flex:1}
.composer button{min-width:70px;border:0;border-radius:14px;background:#9b5de5;color:#fff;font:900 16px Cairo}
.gate{width:100%;text-align:center;display:grid;gap:12px;justify-items:center}
</style>
</head>
<body>
<header class="bar"><a class="back" href="index.html">→ ألعابنا</a><h1 id="title">أصحابي</h1><a class="back" href="me.html">شخصيتي</a></header>

<main class="page">
  <div class="gate" id="gate" hidden><h2>لازم تعمل شخصيتك أول</h2><p class="mute">عشان تضيف أصحاب وتحكي معهم.</p><a class="btn" href="me.html" style="display:grid;place-items:center;text-decoration:none">اعمل شخصيتك</a></div>

  <div id="list" hidden style="width:100%;display:grid;gap:14px">
    <div class="card">
      <h3>ضيف صاحب</h3>
      <form class="add" id="addF"><input id="codeIn" maxlength="6" placeholder="كود صاحبك" aria-label="كود صاحبك" autocomplete="off"><button class="btn small">ضيف</button></form>
      <p class="msg" id="addMsg"></p>
      <div class="mycode">كودك: <b id="myCode"></b><button class="btn small" id="copy" type="button">انسخ</button></div>
    </div>
    <div class="card" id="reqCard" hidden><h3>طلبات صداقة</h3><div id="reqs"></div></div>
    <div class="card"><h3>أصحابي</h3><div id="friends"><p class="empty">جاري التحميل…</p></div></div>
  </div>

  <div id="chat" hidden>
    <div class="chead"><button class="back" id="backList" style="border:0;cursor:pointer">→</button><div id="cAv"></div><div class="n" id="cName"></div><button class="btn small" id="unfriend" style="background:none;box-shadow:none;border:2px solid var(--mute);color:var(--mute)">حذف</button></div>
    <div class="log" id="log"></div>
    <form class="composer" id="sendF"><input id="msgIn" maxlength="500" placeholder="اكتب رسالة…" autocomplete="off" aria-label="رسالة"><button>ابعت</button></form>
  </div>
</main>

<script type="module">
import { onUser, avatarSVG, isOnline, addFriendByCode, acceptRequest, rejectRequest, removeFriend, watchRequests, watchFriends, watchChat, sendMessage, watchUser, lastRead, markRead, joinUrl, GAMES } from './social.js';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let started = false, friends = [], chatStop = null, peerStop = null, cur = null, latest = {}, latestStops = {};
const ago = f => { if (isOnline(f)) return 'أونلاين هلّق'; if (!f.lastSeen) return ''; const m = Math.round((Date.now() - f.lastSeen) / 60000); return m < 60 ? `آخر ظهور قبل ${m} دقيقة` : m < 1440 ? `آخر ظهور قبل ${Math.round(m / 60)} ساعة` : `آخر ظهور قبل ${Math.round(m / 1440)} يوم`; };

onUser((u, p) => {
  if (!u || !p) { $('#gate').hidden = false; $('#list').hidden = true; $('#chat').hidden = true; return; }
  $('#gate').hidden = true;
  $('#myCode').textContent = p.code || '—';
  if (started) return; started = true;
  showList();
  watchRequests(rs => {
    $('#reqCard').hidden = !rs.length;
    $('#reqs').innerHTML = rs.map(r => `<div class="row"><div class="av">${avatarSVG(r.av, 44)}</div><div class="n">${esc(r.name)}<small>بدّه يصير صاحبك</small></div><div class="acts"><button data-ok="${esc(r.uid)}">اقبل</button><button class="no" data-no="${esc(r.uid)}">لا</button></div></div>`).join('');
  });
  watchFriends(list => {
    friends = list;
    list.forEach(f => { if (!latestStops[f.uid]) latestStops[f.uid] = watchChat(f.uid, ms => { latest[f.uid] = ms[ms.length - 1] || null; renderFriends(); if (cur === f.uid) markRead(f.uid); }, 1); });
    renderFriends();
  });
});
function renderFriends() {
  const box = $('#friends');
  if (!friends.length) { box.innerHTML = '<p class="empty">لسا ما عندك أصحاب. اطلب من صاحبك كوده وضيفه فوق.</p>'; return; }
  box.innerHTML = friends.map(f => {
    const l = latest[f.uid], unread = l && l.from === f.uid && l.ms > lastRead(f.uid);
    const sub = l ? (l.t === 'inv' ? '🎮 عزمك على ' + (GAMES[l.game] ? GAMES[l.game].name : 'لعبة') : (l.from === f.uid ? '' : 'إنت: ') + l.text) : ago(f);
    return `<div class="row"><div class="av">${avatarSVG(f.av, 48)}<span class="dot ${isOnline(f) ? 'on' : ''}"></span></div><div class="n">${esc(f.name)}<small>${esc(sub).slice(0, 60)}</small></div><div class="acts"><button data-chat="${esc(f.uid)}">شات${unread ? '<span class="badge">●</span>' : ''}</button></div></div>`;
  }).join('');
}
$('#reqs').addEventListener('click', async e => { const b = e.target.closest('button'); if (!b) return; b.disabled = true; try { b.dataset.ok ? await acceptRequest(b.dataset.ok) : await rejectRequest(b.dataset.no); } catch (er) { b.disabled = false; } });
$('#friends').addEventListener('click', e => { const b = e.target.closest('button[data-chat]'); if (b) openChat(b.dataset.chat); });
$('#addF').addEventListener('submit', async e => {
  e.preventDefault(); $('#addMsg').textContent = 'لحظة…';
  try { const r = await addFriendByCode($('#codeIn').value); $('#addMsg').textContent = r.err || r.ok; if (r.ok) $('#codeIn').value = ''; }
  catch (er) { $('#addMsg').textContent = 'ما زبط، جرّب كمان'; }
});
$('#copy').onclick = () => navigator.clipboard && navigator.clipboard.writeText($('#myCode').textContent).then(() => $('#copy').textContent = 'انتسخ ✓', () => {});

function showList() { cur = null; if (chatStop) chatStop(); if (peerStop) peerStop(); chatStop = peerStop = null; $('#list').hidden = false; $('#list').style.display = 'grid'; $('#chat').hidden = true; $('#title').textContent = 'أصحابي'; renderFriends(); }
function openChat(uid) {
  cur = uid; $('#list').hidden = true; $('#list').style.display = 'none'; $('#chat').hidden = false; $('#title').textContent = 'شات';
  $('#log').innerHTML = '<p class="empty">جاري التحميل…</p>';
  peerStop = watchUser(uid, f => { $('#cAv').innerHTML = avatarSVG(f.av, 40); $('#cName').innerHTML = `${esc(f.name)}<small>${esc(ago(f))}</small>`; });
  chatStop = watchChat(uid, ms => {
    markRead(uid);
    const log = $('#log');
    log.innerHTML = ms.length ? ms.map(m => {
      const mine = m.from !== uid, tm = new Date(m.ms).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
      if (m.t === 'inv') { const g = GAMES[m.game]; return `<div class="b inv ${mine ? 'me' : ''}"><div class="t">${mine ? 'عزمته على' : 'عزمك على'} ${esc(g ? g.name : 'لعبة')}<time>كود ${esc(m.code)} · ${tm}</time></div>${!mine && g ? `<a href="${esc(joinUrl(m.game, m.code))}">ادخل</a>` : ''}</div>`; }
      return `<div class="b ${mine ? 'me' : ''}">${esc(m.text)}<time>${tm}</time></div>`;
    }).join('') : '<p class="empty">ما في رسائل لسا. قول مرحبا 👋</p>';
    window.scrollTo(0, document.body.scrollHeight);
  }, 100);
  setTimeout(() => $('#msgIn').focus(), 50);
}
$('#backList').onclick = showList;
$('#sendF').addEventListener('submit', async e => { e.preventDefault(); const t = $('#msgIn').value.trim(); if (!t || !cur) return; $('#msgIn').value = ''; try { await sendMessage(cur, t); } catch (er) { $('#msgIn').value = t; } });
$('#unfriend').onclick = async () => { if (!cur) return; const b = $('#unfriend'); if (b.dataset.sure) { await removeFriend(cur).catch(() => {}); b.dataset.sure = ''; b.textContent = 'حذف'; showList(); } else { b.dataset.sure = '1'; b.textContent = 'متأكد؟'; setTimeout(() => { b.dataset.sure = ''; b.textContent = 'حذف'; }, 3000); } };
</script>
</body>
</html>
